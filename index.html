<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSoal AI Pro - SMPN 1 Plampang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; font-size: 12pt; }
            .print-container { shadow: none !important; border: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-blue-700 text-white px-6 py-4 shadow-md flex justify-between items-center no-print">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-graduation-cap text-3xl"></i>
            <div>
                <h1 class="text-xl font-bold leading-tight">EduSoal AI Pro</h1>
                <p class="text-xs text-blue-200">SMPN 1 Plampang • Integrasi Kurikulum Indonesia</p>
            </div>
        </div>
        <div class="flex space-x-2">
            <button class="bg-blue-800 hover:bg-blue-900 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generator & Kisi-Kisi
            </button>
            <button class="bg-blue-800 hover:bg-blue-900 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-user-gear"></i> Dashboard Admin
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Form Konfigurasi (No Print) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 no-print">
            <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-600"></i> Pengaturan Naskah Soal & Asesmen
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Kurikulum -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Kurikulum</label>
                    <select id="kurikulum" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Kurikulum Merdeka">Kurikulum Merdeka</option>
                        <option value="Kurikulum 2013 (K13)">Kurikulum 2013 / K13 (KD/Indikator)</option>
                    </select>
                </div>

                <!-- Mata Pelajaran -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Mata Pelajaran</label>
                    <select id="mapel" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Informatika ( TIK )">Informatika ( TIK )</option>
                        <option value="IPA (Ilmu Pengetahuan Alam)">Ilmu Pengetahuan Alam (IPA)</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Ilmu Pengetahuan Sosial (IPS)">Ilmu Pengetahuan Sosial (IPS)</option>
                        <option value="PPKn">PPKn</option>
                        <option value="Pendidikan Agama">Pendidikan Agama</option>
                    </select>
                </div>

                <!-- Kelas / Semester -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Kelas / Semester</label>
                    <select id="kelas" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="VII / Ganjil">Kelas VII / Ganjil</option>
                        <option value="VIII / Ganjil">Kelas VIII / Ganjil</option>
                        <option value="IX / Ganjil">Kelas IX / Ganjil</option>
                    </select>
                </div>

                <!-- Tahun Ajaran -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Tahun Ajaran</label>
                    <input type="text" id="tahun" value="2026/2027" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Materi -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Materi / Bab</label>
                    <input type="text" id="materi" value="BAB 2. Perangkat & Pengelolaan File" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Penyusun -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Penyusun (Nama Guru)</label>
                    <input type="text" id="penyusun" value="Ardin Yusuf, S.Pd." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Button Action -->
            <div class="mt-4 flex justify-end">
                <button onclick="updateSemuaKonten()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition flex items
